  #   timeout: 30s
  #   max_retries: 3
  #   enabled: false

# 场景化配置 - 不同业务场景使用不同的AI配置
scenarios:
  # 测试用例生成场景
  testcase_generation:
    primary_provider: "dashscope"
    fallback_providers: []  # 暂时不使用备用提供商
    config:
      temperature: 0.7      # 创造性参数，0-1，越高越有创造性
      max_tokens: 4000      # 最大生成token数
      top_p: 0.9           # 核采样参数
      format: "json"        # 输出格式：json 或 text

  # 代码审查场景
  code_review:
    primary_provider: "dashscope"
    fallback_providers: []
    config:
      temperature: 0.3      # 较低的创造性，更注重准确性
      max_tokens: 2000
      top_p: 0.8
      format: "text"

  # 题目生成场景
  problem_generation:
    primary_provider: "dashscope"
    fallback_providers: []
    config:
      temperature: 0.8      # 较高的创造性
      max_tokens: 3000
      top_p: 0.9
      format: "json"

  # AI聊天助手场景
  chat_assistant:
    primary_provider: "dashscope"
    fallback_providers: []
    config:
      temperature: 0.6
      max_tokens: 1500
      top_p: 0.9
      format: "text"

# 全局配置
global:
  enable_cache: true          # 是否启用缓存
  cache_ttl: 10m             # 缓存过期时间
  enable_metrics: true        # 是否启用指标收集
  enable_retry: true          # 是否启用重试机制
  default_timeout: 30s        # 默认超时时间
  max_concurrency: 10         # 最大并发数
  rate_limit_rps: 100         # 每秒请求限制
