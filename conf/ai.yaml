# AI配置文件
# 支持多个AI提供商和场景化配置

# 默认使用的AI提供商
default_provider: "dashscope"

# AI提供商配置
providers:
  # 阿里云百炼大模型平台
  dashscope:
    provider: "dashscope"
    base_url: "https://dashscope.aliyuncs.com"
    model: "qwen-plus"
    timeout: 30s
    max_retries: 3
    enabled: true
    headers:
      User-Agent: "ZHKU-OJ-Server/1.0"

  # # OpenAI GPT (暂时禁用)
