  #   provider: "openai"
  #   # api_key 将从环境变量 OPENAI_API_KEY 中读取
  #   base_url: "https://api.openai.com"
  #   model: "gpt-3.5-turbo"
  #   timeout: 30s
  #   max_retries: 3
  #   enabled: false
  #   # proxy: "http://proxy.example.com:8080"  # 如需代理请取消注释

  # # 智谱AI GLM (暂时禁用)
  # glm:
  #   provider: "glm"
  #   api_key: "${GLM_API_KEY}"
  #   base_url: "https://open.bigmodel.cn"
  #   model: "glm-4"
  #   timeout: 45s
  #   max_retries: 2
  #   enabled: false

  # # 讯飞星火 (暂时禁用)
  # spark:
  #   provider: "spark"
  #   api_key: "${SPARK_API_KEY}"
